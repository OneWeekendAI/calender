  </g>
  <!-- check mark -->
  <circle cx="318" cy="642" r="44" fill="#4f9a5f"/>
  <path d="M296 643l16 17 32-36" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
