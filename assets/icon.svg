<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e3b4"/><stop offset="1" stop-color="#e9c77f"/></linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf6"/><stop offset="1" stop-color="#f7efd9"/></linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe46b"/><stop offset="1" stop-color="#f7c948"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#5b3a10" flood-opacity="0.35"/></filter>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#5b3a10" flood-opacity="0.3"/></filter>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#sh)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/></g>
  <!-- calendar page -->
  <g filter="url(#sh2)">
    <rect x="232" y="236" width="560" height="560" rx="46" fill="url(#paper)"/>
  </g>
  <path d="M232 282a46 46 0 0 1 46-46h468a46 46 0 0 1 46 46v96H232z" fill="#c9553d"/>
  <rect x="232" y="370" width="560" height="8" fill="#a8412d" opacity="0.5"/>
  <!-- binding rings -->
  <g fill="#6b4a2a"><rect x="344" y="200" width="30" height="84" rx="15"/><rect x="650" y="200" width="30" height="84" rx="15"/></g>
  <g fill="#fff6e0" opacity="0.5"><rect x="351" y="208" width="8" height="40" rx="4"/><rect x="657" y="208" width="8" height="40" rx="4"/></g>
  <!-- day grid dots -->
  <g fill="#d9c9a3">
    <rect x="280" y="418" width="46" height="30" rx="8"/><rect x="354" y="418" width="46" height="30" rx="8"/><rect x="428" y="418" width="46" height="30" rx="8"/><rect x="502" y="418" width="46" height="30" rx="8"/><rect x="576" y="418" width="46" height="30" rx="8"/><rect x="650" y="418" width="46" height="30" rx="8"/>
    <rect x="280" y="476" width="46" height="30" rx="8"/><rect x="354" y="476" width="46" height="30" rx="8"/><rect x="428" y="476" width="46" height="30" rx="8"/><rect x="502" y="476" width="46" height="30" rx="8"/>
  </g>
  <!-- sticky note with curled corner -->
  <g transform="rotate(-6 560 640)" filter="url(#sh2)">
    <path d="M400 520h330v250H468l-68-68z" fill="url(#note)"/>
    <path d="M400 702l68 68v-52a16 16 0 0 0-16-16z" fill="#d9a521"/>
    <g stroke="#7a5a12" stroke-width="14" stroke-linecap="round" opacity="0.75">
      <path d="M452 580h226"/><path d="M452 628h226"/><path d="M520 676h158"/>
